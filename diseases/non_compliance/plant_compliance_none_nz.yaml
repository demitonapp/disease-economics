subtype: plant_compliance
label: No published New Zealand figure for the cost of unregistered, uninspected or wrong-category plant
exposure_value: null
exposure_unit: none
exposure_basis: none - no source read gives a fine, stop-work cost or incident cost attributed to plant registration,
  inspection or category failure in New Zealand
exposure_kind: contractor_loss
confidence: low
derivation: as_published
statistic: none
sources:
- worksafe-2019-crane-topic-page
considered:
- source: worksafe-2023-kncc-truck-loader-crane-summary
  reason: Crane-related prosecution (fine $380,000, reduced to $240,000) charged for failing to secure a load, a
    general duty failure, not registration or inspection of the crane.
- source: worksafe-2023-culham-engineering-summary
  reason: Crane lift and collapsed temporary works ($400,000 fine, reparation and costs) charged under the general
    duty, not plant certification.
- source: worksafe-2023-leighs-construction-summary
  reason: Principal contractor in the same lift, $10,000 fine for a duty on engaging another party, with no plant
    registration element.
- source: worksafe-2016-adams-machinery-plant-hire-summary
  reason: 'The nearest plant-hire case: a skid steer delivered with inoperative safety devices, reparation $66,515.20
    and no fine; one 2016 case under the 1992 Act about condition, not registration or category.'
- source: worksafe-2021-vehicle-inspection-nz-summary
  reason: A vehicle inspection company fined $225,000 over a pedestrian death on its own site; transport industry
    and a traffic-management failure, not an inspection certificate.
- source: hesketh-henry-2018-hswa-two-years-on
  reason: An average of $145,033.60 per section 36 offence across all sectors and causes, with no plant split.
- source: worksafe-2026-quarterly-report-q2
  reason: Counts 1,039 improvement and 254 prohibition notices in one quarter with no dollar value and no plant
    category.
- source: worksafe-2026-construction-sector-page
  reason: Gives construction's share of harm and deaths and names vehicles and mobile machinery as a focus, but
    no cost figure and no registration or inspection data.
- source: nzta-2026-schedule-9-public-liability
  reason: Shows NZTA's insurance covers plant not required to be registered for road use and hired plant, with a
    $500,000 deductible; a policy term, not the cost of an unregistered or uninspected machine.
sample_note: 'WorkSafe court summary register searched on "crane", "certificate of inspection", "pressure equipment",
  "crane inspection", "plant registration", "prestart", "registration", "forklift licence" (building and construction,
  and all industries); WorkSafe cranes and construction pages; the quarterly report; a law-firm count of fines.
  The register''s free-text search is not selective ("plant registration" returned all 608 entries), so the entries
  read were those whose titles and facts were plant-related; none was charged for an unregistered or uncertified
  machine. Frequencies exist that the schema cannot hold: construction is about 15% of work-related fatalities and
  serious injuries, with 9 to 10 deaths a year, and vehicles and mobile machinery are a WorkSafe focus area.'
caveat: Recorded as none on purpose. WorkSafe says crane operator qualifications are not mandatory until cranes
  become prescribed high-risk plant, and the plant prosecutions read were brought under the general duties, so a
  fine cannot be assigned to a plant-registration cause. The crane page links the 1999 regulations on pressure equipment,
  cranes and passenger ropeways, which were not read and may carry inspection-certificate penalties. This is a search
  of public registers and pages, not of court files.
status: current
