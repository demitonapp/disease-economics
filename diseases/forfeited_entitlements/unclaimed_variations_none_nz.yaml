subtype: unclaimed_variations
label: >-
  No published New Zealand figure for variations done and not paid, or time-barred, as a share of contract value or of claims
exposure_value: null
exposure_unit: none
exposure_basis: >-
  none - New Zealand sources say contractors go unpaid for variations because of time bars and name variations as a dispute cause, but none measures how often or how much
exposure_kind: contractor_loss
confidence: low
derivation: as_published
statistic: none
sources:
- advisian-2019-nzs-conditions-of-contract
considered:
- source: russell-mcveagh-2020-construction-disputes-survey
  reason: >-
    Perception survey: employer variations are the leading cause of delay and 13% of respondents expect variations to cause disputes. Shares of respondents; no money or count of unpaid variations.
- source: building-disputes-tribunal-2023-adjudication
  reason: >-
    Names claims for variations among the common issues in adjudication but says it has not collected statistics on issue types, so no count or value of variation claims.
- source: atapattu-2023-nz-road-cost-overruns
  reason: >-
    Rates variations and extra works 64% on a severity index (21st of 53). A rating of importance; the 19.5% mean overrun on 106 road projects is not split into variations or time-barred claims.
- source: adafin-2021-nz-budget-risk-factors
  reason: >-
    Survey of 64 project managers on the gap between cost plan and tender sum (23.86% drift). Pre-award estimating, not variations claimed or missed during a contract.
- source: ramachandra-2011-payment-problems
  reason: >-
    Of 40 High Court payment disputes 2008 to 2010, some concern variation claims, but the paper gives no split by issue and no value of variations unpaid.
- source: raina-2015-retention-practice
  reason: >-
    Retention thesis; one subcontractor comment in Table 5.16 says negotiation losses on variations are a larger burden than retention, a single unquantified remark.
- source: oag-2020-nzta-network-outcomes-contracts
  reason: >-
    National audit of state highway maintenance contracts; does not report variations or claims.
- source: te-waihanga-2022-infrastructure-delivery-cost
  reason: >-
    Cites a California study that bids rise when scope later varies; no New Zealand variation data.
- source: mbachu-2014-nz-contractual-risks
  reason: >-
    Abstract only: ranks contractual risk categories by significance (pricing is one). No money and no variation measure.
sample_note: >-
  Search terms: New Zealand construction variations unpaid study; variation claims time bar New Zealand; Waka Kotahi state highway contract variations percentage; contractors not paid for variations New Zealand; NZS 3910 variations survey; Auditor-General Transport Agency claims variations; Transmission Gully claims. A frequency exists: Advisian 2019 reports an industry view that contractors are not being paid for variations because of time bars (often 10 working days), and 13% of Russell McVeagh 2020 respondents expect variations to cause disputes; neither is a cost. Transmission Gully payments to the builder were seen in press only and are one project, so they were not opened as sources. The Treasury report is the source of record because it is the national New Zealand source that deals directly with variation time bars.
caveat: >-
  Recorded as none on purpose. The time-bar complaint is the view of contractors and industry bodies reported in a government-commissioned review, which also gives the public sector's reason for time bars; it is not a measurement. Not read: the Waka Kotahi final account data (an Official Information Act request would be needed), NZS 3910 commentary, and court decisions on time-barred claims.
status: current
