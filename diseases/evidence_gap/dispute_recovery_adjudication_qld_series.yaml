subtype: payment
label: >-
  Adjudication awards against amounts claimed, Queensland 2020-21 to 2024-25 (decisions released)
exposure_value: 0.1488
exposure_unit: ratio_of_other
denominator: amount_claimed
exposure_basis: >-
  of the amount claimed in adjudication decisions released, pooled over five financial years
exposure_kind: money_at_stake
confidence: moderate
exposure_range:
  low: 0.0856
  high: 0.4559
  kind: reported_min_max
derivation: calculated
calculation: >-
  Awarded / claimed on decisions released, by year: 2020-21 $37,503,111 / $82,254,751 = 0.456; 2021-22
  $15,854,534 / $51,816,751 = 0.306; 2022-23 $21,858,656 / $152,408,699 = 0.143; 2023-24 $61,524,294 /
  $225,306,009 = 0.273; 2024-25 $81,873,482 / $956,966,294 = 0.086. Pooled over five years: $218,614,077
  / $1,468,752,504 = 0.1488.
statistic: pooled_ratio
sample_size:
  n: 983
  unit: decisions
  note: 'QBCC decisions released 2020-21 to 2024-25: 187 + 176 + 172 + 234 + 214; pooled dollars, so 2024-25
    dominates'
sources:
- source: qbcc-2021-annual-report
  location: Table 6, decisions released
- source: qbcc-2022-annual-report
  location: Table 6, decisions released
- source: qbcc-2023-annual-report
  location: Table 6, decisions released
- source: qbcc-2024-annual-report
  location: Table 6, decisions released
- source: qbcc-2025-annual-report
  location: Table 23, p.23
sample_note: >-
  Every decision released by the QBCC Adjudication Registry under the Building Industry Fairness (Security
  of Payment) Act 2017, 2020-21 to 2024-25: 983 decisions. By year: 2020-21 45.6%, 2021-22 30.6%, 2022-23
  14.3%, 2023-24 27.3%, 2024-25 8.6%.
caveat: >-
  Pooled dollars, so the largest claims dominate: 2024-25 alone is 65% of the amount claimed, and one
  A$634m claim sits inside it. The annual rate swings from 8.6% to 45.6%. It counts only disputes that
  reached a released decision, not every payment claim.
status: current
