subtype: closeout_dispute
label: No published national figure for the cost of close-out disputes in Australia
exposure_value: null
exposure_unit: none
exposure_basis: >-
  none - no Australian national source found gives an amount, a share of contract value or a share of disputes for
  practical completion, defects, final account, retention or security held past release
exposure_kind: money_at_stake
confidence: low
derivation: as_published
statistic: none
sources:
- source: murray-2017-security-of-payment-review
  location: Section 15.5 'Retentions and bank guarantees', p.270
considered:
- source: campos-gutierrez-2013-court-case-disputes
  reason: >-
    Damages (45 of 78 cases) mostly means defective work, but there is no close-out category and no amounts.
- source: rahnamayiezekavat-2022-nsw-disputes-typology
  reason: >-
    Quality (workmanship) is 13% of 230 NSW cases (Table 3, p.9), but not split by stage and has no amounts; NSW
    only.
- source: byrne-2019-subcontractor-nonpayment
  reason: >-
    Queensland subcontractors report final claims cut for defects or liquidated damages; the $288,000 average loss is
    for all non-payment, not close-out, and is state-level.
- source: love-2017-change-orders
  reason: >-
    Draws on 67 projects' completed final accounts, but measures change orders (11% of work value), not
    disputes about the final account.
- source: productivity-commission-2014-public-infrastructure
  reason: >-
    Silent on retention money, defects liability and final accounts (its 'retention' hits concern workforce).
- source: acif-2023-subsurface-risk-allocation
  reason: >-
    Mentions extensions to practical completion and defects in subsurface clauses only; no data.
- source: infrastructure-australia-2021-national-infrastructure-risk
  reason: >-
    Names completion and commissioning as a risk by sector with no dispute data.
- source: hka-2026-crux-ninth-report
  reason: >-
    Reports deficient workmanship on 20.1% of Americas projects; no close-out category and nothing Australian.
- source: arcadis-2022-global-construction-disputes
  reason: >-
    Lists defective specifications among typical claims; no close-out stage, amounts or Australian split.
- source: dga-2023-adjudication-outcomes
  reason: >-
    State adjudication totals for all payment claims; retention and final account claims are not separated.
sample_note: >-
  Search terms: retention money Australia estimate held; practical completion dispute Australia; final account
  dispute; defects liability dispute cost; building defects rectification national study; security of payment
  retention; Murray review, Productivity Commission, Infrastructure Australia, Arcadis, HKA CRUX. No national
  count of retention or final account disputes was found: the Murray review (p.270) says subcontractors often judge
  recovery of retention not worth its cost, but does not size it. A web estimate of about $18 billion of retentions
  outstanding was seen only in a vendor's back-of-envelope post and is not offered.
caveat: >-
  Recorded as `none` on purpose. Ten sources were opened (listed above); none states an Australian national amount
  or share for close-out disputes. The UK retention survey (Pye Tait 2017) is already in the corpus under another
  disease and does not apply to Australia. This is the next place to look for research, not a zero.
status: current
