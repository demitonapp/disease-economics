sample_note: >-
  One contractor's project data, collected by its quality managers. Adding post-completion corrections
  raises the average to 0.76%.
caveat: >-
  SECONDARY - the paper itself returned 403 and was read through ASCE's news write-up. The article gives
  no sample size, country or sector. The same study found actual costs underreported by around 300%, which
  is the number that matters here: most rework is never written down as rework.
