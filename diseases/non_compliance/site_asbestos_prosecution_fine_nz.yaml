label: Median fine in nine asbestos prosecutions in New Zealand building and construction, 2017-2023
exposure_value: 16000.0
exposure_unit: per_incident
currency: NZD
price_year: 2020
exposure_basis: NZD fine per prosecution under the Health and Safety at Work Act 2015 for asbestos offences (survey,
  notification, licensed removal, demolition of contaminated buildings); median of nine; mean $54,247
exposure_kind: contractor_loss
confidence: low
exposure_range:
  low: 1100.0
  high: 318750.0
  kind: reported_min_max
derivation: calculated
calculation: 'Fines as the WorkSafe register states them, sorted: $1,100 (Gannaway 2023); $3,000 (Knight 2018);
  $10,000 (Topham 2017); $15,000 (Sibley 2020); $16,000 (Ecologically Sound Demolition 2020); $23,375 (Inspired
  Enterprises 2023, after appeal); $35,000 (Robertson 2018); $66,000 (Wilson Building Timaru 2023); $318,750 (Crafar
  Crouch Construction 2018). The median is the fifth value, $16,000. Sum $488,225, mean $54,247 (488,225 / 9). price_year
  2020 is the middle decision year; the amounts are nominal.'
statistic: median
sample_size:
  n: 9
  unit: cases
  note: Convicted defendants with a fine above zero, industry recorded as building and construction, offence decided
    under the Health and Safety at Work Act 2015, charged with asbestos offences.
