sample_note: >-
  The civil engineering subgroup of the 139 Australian projects in design_error_cost_au. The abstract does
  not give how many of the 139 were civil. Fit-out projects averaged 22.50% and projects above A$101
  million 26.18%.
caveat: >-
  Graded low because the subgroup size is not in the abstract, and the 2012 abstract on what appears to be the same
  sample says cost did not vary significantly by project type. Respondents' estimates, not cost records, and
  the carrier of the cost is not stated. Abstract only; full text not read. Whether the sampled civil
  projects were road, rail or utilities is not stated.
