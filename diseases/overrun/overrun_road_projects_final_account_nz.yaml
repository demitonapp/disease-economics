label: Mean cost overrun of 106 completed New Zealand road projects, final account against forecast cost
exposure_value: 0.195
exposure_unit: ratio_of_other
denominator: budget_at_decision
exposure_basis: >-
  of each project's forecast cost, the final account minus the forecast, averaged over 106 completed road projects whose records came from the NZ Transport Agency and Auckland Transport (all causes together). The thesis defines overrun against the "preliminary stage project budget" (printed p.84, following the decision-stage definitions of Love, Flyvbjerg and Odeck), which is why budget_at_decision is filed; but its table and method call the baseline only the "forecasted cost", and its data chapter says the cost estimate came from contract documents, so the stage of the forecast in the records is stated by intent and not shown.
exposure_kind: owner_side
confidence: moderate
derivation: as_published
statistic: mean
sample_size:
  n: 106
  unit: projects
  note: Completed New Zealand road projects of the past twenty years for which the Transport Agency and Auckland Transport held usable records; 41 under NZ$10 million, 55 from $10 to $100 million, 10 over $100 million.
sources:
- source: atapattu-2023-massey-thesis-road-cost-estimation
  location: Table 4.1, PDF p.113 (printed p.93); overrun definition on printed p.91; "general cost overrun percentage of road projects in NZ is 19.5%" on printed p.97
sample_note: >-
  Table 4.1 gives the mean percentage cost overrun as 21.6% for small projects (41), 17.8% for medium (55), 19.6% for large (10) and 19.5% in total, with a median of 18% in the table and a standard deviation of 16.07% in the text (printed p.97); 96.2% of the projects overran and the rest finished at or under forecast, so the mean is net of those. The group means weighted by project count give 19.4%, so the percentage rows are consistent with each other. The text rounds the group means to 22%, 18% and 20%. Records were limited to projects the agencies could still produce data for, and the thesis notes private-sector projects could not be obtained.
caveat: >-
  Owner-side: the road controlling authority's cost against its own forecast, not a contractor's loss. All causes together. The thesis does not show whether the forecast in the records is the decision-stage budget, a design estimate or the contract price (it sizes projects by contract price and says contract documents hold the cost estimate), so treat the comparison with figures measured from the decision to build as the thesis's own, not confirmed. The table's dollar rows do not reconcile: for small projects the sum of overruns (NZ$523.3 million) exceeds the sum of total project cost (NZ$240 million), the all-projects share of 20% does not equal 815.7 / 5,077, and the text puts the projects' total value at about NZ$1.5 billion against the table's 5,077 million; only the percentage rows are used here. The sample is the projects NZTA and Auckland Transport could still produce records for (no other councils, no private clients), a doctoral thesis, one researcher's collection, not independently audited.
status: withdrawn
withdrawn_reason: >-
  The baseline cannot be confirmed. The thesis does not show whether the forecast in the records is the decision-stage
  budget, a design estimate or the contract price, so the figure cannot be read against any one denominator, and it is
  filed under budget_at_decision only by assumption. It can return if the records' baseline is confirmed.
history:
  - changed_on: '2026-11-02'
    reason: withdrawn before any tagged release, SM070; the baseline of the 19.5% mean overrun is unconfirmed
