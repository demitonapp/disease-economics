subtype: payment_dispute
label: >-
  Average amount of a contractor's most recent claim under security of payment laws, Australia 2017 survey
exposure_value: 221633.0
exposure_unit: per_incident
currency: AUD
price_year: 2017
exposure_basis: >-
  Australian dollars claimed per incident: the amount of the respondent's most recent claim for delayed or disputed
  payment made under a security of payment Act, averaged over the respondents who had made one
exposure_kind: money_at_stake
confidence: moderate
derivation: as_published
statistic: mean
sources:
- source: murray-2017-security-of-payment-review
  location: Appendix B 'Survey of contractors', 'Security of payment laws and claims made', p.324
considered:
- source: campos-gutierrez-2013-court-case-disputes
  reason: >-
    Payments were a factor in 50 of 78 Australian court cases, but that counts cases and gives no amounts.
- source: dga-2023-adjudication-outcomes
  reason: >-
    Amounts claimed and determined for NSW, Queensland and Victoria only, so state-level and not an AU figure.
- source: nsw-2012-sop-adjudication-report
  reason: >-
    NSW 2011-12 adjudication amounts only; state-level and fourteen years old.
- source: rahnamayiezekavat-2022-nsw-disputes-typology
  reason: >-
    Payment is 31% of 230 NSW cases, a frequency for one state with no amounts.
- source: acica-2025-arbitration-statistics-2024
  reason: >-
    National arbitration caseload with total values but no payment-dispute split.
sample_note: >-
  A survey commissioned for the Murray Review and run by AMR Interactive: 526 responses from contractors and
  subcontractors in all states and territories, circulated by industry associations on a voluntary basis. Only the
  23% of respondents who had ever made a claim under security of payment laws answered the amount question; the
  report does not give their number. The most common band among those who claimed in the last two years was
  $100,001 to $500,000 (25%). Not all of this money was awarded or lost: this is what was claimed.
caveat: >-
  A self-selected sample: 46.8% of respondents were from Queensland, 30.8% from Western Australia and 17.9% from
  NSW, 45% were electrical contractors and 73% worked for firms of 20 or fewer people, so the average describes
  small and medium trades and is not a typical national claim. It is one claim per respondent (the most recent),
  as the respondents recalled it. The report does not date the survey; the Review ran during 2017, which is the
  price year used. No median is given. A per-claim amount, not a share of contract value, so it is never
  multiplied by one.
status: current
