sample_note: >-
  AU$61.8 billion total (4.1% of GDP), of which construction was AU$5.84 billion. Employers bear 5% excluding
  premiums, about 19% including them. The UK is almost identical at about 19% (HSE 2025).
caveat: >-
  SOCIETAL, NOT THE CONTRACTOR'S BILL. Workers and the community bear the rest - recorded so the surface
  can show the real picture and exclude it from the headline. The report is internally inconsistent (74/21
  in the summary, 77/18 in para 89) and its latest edition covers 2012-13. No construction-specific employer
  share exists.
