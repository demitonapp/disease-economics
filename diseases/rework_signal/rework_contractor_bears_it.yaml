label: >-
  Contractor bore rework cost directly on 93% of projects; 23% of yearly profit lost
exposure_value: null
exposure_unit: none
exposure_basis: incidence and profit impact, not a share of contract value
exposure_kind: contractor_loss
confidence: moderate
derivation: as_published
statistic: none
sources:
- love-2019-make-or-break
sample_note: >-
  98 projects with complete cost data (of 346 projects and 19,605 rework events), one contractor, six
  years of ledger data, public and private clients, building and infrastructure.
caveat: >-
  Recorded rework was only 0.39% of contract value - the ledgers undercount. Margins were 6-9%, which
  is why 0.39% wiped out roughly a quarter of yearly profit. The 2018 paper on the same data reports 28%;
  cite one and say which.
status: current
