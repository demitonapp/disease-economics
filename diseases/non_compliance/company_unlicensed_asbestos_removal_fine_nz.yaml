subtype: company_compliance
label: Median fine in three prosecutions of unlicensed asbestos removal, New Zealand 2018-2023
exposure_value: 15000.0
exposure_unit: per_incident
currency: NZD
price_year: 2020
exposure_basis: NZD fine per prosecution where the defendant, or the worker doing the removal, held no WorkSafe
  asbestos removal licence; median of $3,000, $15,000 and $66,000
exposure_kind: contractor_loss
confidence: low
exposure_range:
  low: 3000.0
  high: 66000.0
  kind: reported_min_max
derivation: calculated
calculation: 'Median of three fines as the WorkSafe register states them: Knight $3,000 (decided 2 November 2018),
  Sibley $15,000 (11 November 2020), Wilson Building Timaru Limited $66,000 (29 September 2023, after a 20% and
  a 25% discount from a $120,000 starting point). The middle value is $15,000. The mean would be $28,000. price_year
  2020 is the year of the middle decision; the amounts are not adjusted for inflation.'
statistic: median
sample_size:
  n: 3
  unit: cases
  note: Entries in WorkSafe's court summary register whose facts say the person removing asbestos held no licence,
    decided under the Health and Safety at Work Act 2015 in building and construction.
sources:
- source: worksafe-2025-court-summaries-asbestos
  location: entries richard-john-knight ($3,000), glenn-warwick-sibley ($15,000), wilson-building-timaru-limited
    ($66,000)
considered:
- source: mbie-2023-dodd-unlicensed-work-release
  reason: Unlicensed restricted building work, a different licence regime held by an individual; filed under people_compliance.
- source: mbie-2025-lbp-maximum-fine-ris
  reason: Disciplinary fines on licensed practitioners ($500 to $5,000) are for poor work, not for lacking a licence.
- source: building-practitioners-board-2025-annual-report
  reason: Counts penalties on practitioners with no dollar amounts.
- source: worksafe-2026-quarterly-report-q2
  reason: Counts of notices and prosecutions only.
sample_note: 'WorkSafe''s court summary register searched on "asbestos" (24 entries), "licence" and "unlicensed"
  in building and construction. Three entries say the person removing asbestos held no licence and were decided
  under the 2015 Act. Entries excluded from the set: Ecologically Sound Demolition ($16,000, a licensed removalist
  was engaged but not present), Essential Homes ($30,000, mainly a prohibition-notice breach that included unlicensed
  removal) and Crafar Crouch ($318,750, the summary does not say whether it held a licence). The licence regimes
  found are the asbestos removal licences (Class A and Class B) and the LBP scheme for restricted building work;
  no general contractor licence was found.'
caveat: Three cases, graded low. Two defendants were individuals (Knight, Sibley) and one a company whose worker
  was unlicensed (Wilson Building Timaru), so the set mixes individuals and a company, and the largest fine reflects
  other workers' exposure over four days, not the missing licence alone. Each fine covers the whole offence charged,
  not the licensing breach by itself. Amounts are as stated in the register, nominal, from 2018 to 2023. The cases
  overlap the asbestos set used for site_compliance.
status: current
